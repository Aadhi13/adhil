<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">

  <title>Adhil Ameen — Web Developer</title>
  <meta name="description" content="Adhil Ameen — Web developer interested in Linux, free and open-source software, and Wikimedia contributions.">
  <link rel="canonical" href="https://adhil.tech/">

  <style>
    :root {
      --bg: #fafaf9;
      --text: #1c1917;
      --muted: #57534e;
      --accent: #2563eb;
      --border: #e7e5e4;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #141413;
        --text: #f5f5f4;
        --muted: #a8a29e;
        --accent: #60a5fa;
        --border: #292524;
      }
    }

    *,
    *::before,
    *::after { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      font: 1.125rem/1.7 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      color: var(--text);
      background: var(--bg);
    }

    main {
      width: 100%;
      max-width: 36rem;
      margin: 0 auto;
      padding: 3rem 1.5rem;
    }

    h1 {
      margin: 0;
      font-size: clamp(2rem, 7vw, 2.75rem);
      line-height: 1.15;
    }

    .role {
      margin: 0.25rem 0 1.5rem;
      color: var(--muted);
    }

    h2 {
      margin: 2.5rem 0 0.75rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--border);
      font-size: 0.8rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
    }

    p { margin: 0 0 1rem; }

    ul {
      margin: 1rem 0 0;
      padding: 0;
      list-style: none;
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem 1.25rem;
    }

    a {
      color: var(--accent);
      text-underline-offset: 0.2em;
    }

    a:hover { text-decoration-thickness: 2px; }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 2px;
    }

    .wave {
      display: inline-block;
      transform-origin: 70% 70%;
      animation: wave 2.2s ease-in-out infinite;
    }

    @keyframes wave {
      0%, 60%, 100% { transform: rotate(0deg); }
      10%, 30%      { transform: rotate(14deg); }
      20%, 40%      { transform: rotate(-8deg); }
      50%           { transform: rotate(10deg); }
    }

    @media (prefers-reduced-motion: reduce) {
      .wave { animation: none; }
    }

    footer {
      padding: 1.5rem;
      text-align: center;
      font-size: 0.875rem;
      color: var(--muted);
    }
  </style>
</head>

<body>
  <main>
    <h1>Adhil Ameen</h1>
    <p class="role">Web developer</p>

    <p>
      <span class="wave" aria-hidden="true">👋</span> Hi, nice to meet you!
      I build things for the web and love tinkering with Linux and
      free and open-source software. I also contribute to Wikimedia
      projects. Feel free to say hello.
    </p>

    <h2>Contact</h2>
    <p><a href="mailto:adhilameen@proton.me">adhilameen@proton.me</a></p>

    <ul>
      <li><a href="https://github.com/aadhi13" target="_blank" rel="me noopener noreferrer">GitHub</a></li>
      <li><a href="https://linkedin.com/in/adhil-ameen/" target="_blank" rel="me noopener noreferrer">LinkedIn</a></li>
      <li><a href="https://x.com/__adhil_ameen" target="_blank" rel="me noopener noreferrer">X</a></li>
    </ul>
  </main>

  <footer>
    <p>&copy; 2026 Adhil Ameen</p>
  </footer>
</body>
</html>
